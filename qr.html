<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رمز كنز الربع الخالي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  :root { --sand: #D2913A; --brown: #8A5A2B; --ink: #3B2614; --bg: #FDF6E9; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Tajawal', system-ui, sans-serif; color: var(--ink);
    background: var(--bg);
    display: flex; flex-direction: column; align-items: center;
    padding: 16px;
  }
  .tools {
    width: 100%; max-width: 640px;
    background: #fff; border-radius: 16px; padding: 14px 16px; margin-bottom: 18px;
    box-shadow: 0 4px 14px rgba(90,55,20,.12);
  }
  .tools label { display: block; font-weight: 700; margin-bottom: 6px; }
  .tools .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .tools input {
    flex: 1; min-width: 220px; font: inherit; font-size: 1rem;
    padding: 10px 12px; border: 2px solid #E8D3AE; border-radius: 10px; direction: ltr;
  }
  .tools button {
    font: inherit; font-weight: 700; font-size: 1rem;
    border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer;
    background: var(--sand); color: #fff;
  }
  .tools small { display: block; margin-top: 8px; color: #6B4F35; line-height: 1.6; }

  .sheet {
    width: 100%; max-width: 640px;
    background: #fff; border: 6px solid var(--sand); border-radius: 28px;
    padding: 36px 24px 28px; text-align: center;
  }
  .sheet .kicker { font-weight: 700; color: var(--brown); font-size: 1.2rem; margin: 0 0 4px; }
  .sheet h1 { margin: 0 0 22px; font-size: clamp(1.8rem, 7vw, 2.6rem); font-weight: 800; color: var(--ink); }
  #qr { display: inline-block; padding: 14px; background: #fff; border-radius: 16px; border: 2px dashed #E8C27F; }
  #qr svg { display: block; width: min(70vw, 340px); height: auto; }
  .sheet .icons { font-size: 2rem; letter-spacing: 6px; margin: 18px 0 6px; }
  .sheet .url { direction: ltr; font-size: .95rem; color: #6B4F35; word-break: break-all; margin: 0; }

  @media print {
    @page { size: A4 portrait; margin: 14mm; }
    body { background: #fff; padding: 0; }
    .tools { display: none; }
    .sheet { max-width: none; border-width: 5px; margin-top: 10mm; }
    #qr svg { width: 110mm; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
  <div class="tools">
    <label for="url">رابط الصفحة بعد النشر</label>
    <div class="row">
      <input id="url" type="url" inputmode="url" spellcheck="false">
      <button type="button" id="printBtn">🖨️ اطبعي</button>
    </div>
    <small>الرابط يتعبّى تلقائياً لما تفتحين هذي الصفحة من موقعك على GitHub Pages. لو تبين رابط ثاني، اكتبيه هنا ويتحدّث الرمز مباشرة. هذا الجزء ما يطلع في الطباعة.</small>
  </div>

  <section class="sheet">
    <p class="kicker">كنز الربع الخالي</p>
    <h1>امسحي الرمز لتكتشفي الكنز</h1>
    <div id="qr" aria-label="رمز QR لرابط تجربة كنز الربع الخالي"></div>
    <div class="icons" aria-hidden="true">🏛️ 🛢️ 🌴 💎</div>
    <p class="url" id="urlText"></p>
  </section>

<script>
  const input = document.getElementById('url');
  const qrBox = document.getElementById('qr');
  const urlText = document.getElementById('urlText');

  // الافتراضي: نفس المجلد اللي فيه qr.html (أي صفحة index.html)
  const params = new URLSearchParams(location.search);
  const fallback = location.protocol.startsWith('http') ? new URL('./', location.href).href : '';
  input.value = params.get('url') || fallback;

  function render() {
    const value = input.value.trim();
    urlText.textContent = value;
    if (!value) { qrBox.innerHTML = '<p>اكتبي الرابط فوق ليظهر الرمز</p>'; return; }
    const qr = qrcode(0, 'M');
    qr.addData(unescape(encodeURIComponent(value)));
    qr.make();
    qrBox.innerHTML = qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
  }
  input.addEventListener('input', render);
  document.getElementById('printBtn').addEventListener('click', () => window.print());
  render();
</script>
</body>
</html>
